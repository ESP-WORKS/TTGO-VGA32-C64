; MCUME esp64 (C64) -> TTGO VGA32 + ponte T-Display
; framework = arduino. Video e teclado PS/2 pela FabGL.

[platformio]
default_envs = vga32

[env:vga32]
platform  = espressif32@6.12.0
framework = arduino
board     = esp32dev

board_build.f_cpu       = 240000000L
board_build.flash_mode  = dio
board_build.f_flash     = 40000000L
board_build.partitions  = huge_app.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

lib_deps =
    fdivitto/FabGL @ ^1.0.9

; src/reSID/sid.cpp e' um unity build: da #include em todos os .cc de
; src/reSID/reSID/. Sem excluir a pasta, a PlatformIO compila os .cc de novo
; e o link quebra com simbolo duplicado.
build_src_filter = +<*> -<reSID/reSID/>

; PSRAM ligada. Nao serve para o framebuffer (o DMA do I2S so' le DRAM
; interna), mas libera RAM interna ao hospedar o resto.
build_flags =
    -Isrc/reSID
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2
    -Wno-error
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-unused-function
    -Wno-char-subscripts
    -Wno-format
    -Wno-write-strings
    -Wno-deprecated-declarations
    -Wno-narrowing