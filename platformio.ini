; MCUME esp64 (C64) -> TTGO VGA32 + ponte T-Display
; framework = arduino. Video e teclado PS/2 pela FabGL.

[platformio]
default_envs = vga32

[env:vga32]
platform  = espressif32@6.12.0
framework = arduino
board     = esp32dev

board_build.f_cpu       = 240000000L
; QIO: 4 linhas de dados em vez de 2. Dobra a largura de banda da flash, que
; e' de onde o emulador busca instrucao -- o gargalo medido neste projeto.
board_build.flash_mode  = qio
; 80 MHz em vez de 40. O emulador executa da flash via cache, e o gargalo em
; cena pesada e' stall de busca de instrucao. Dobrar o clock da flash corta
; esse tempo pela metade -- e' a mudanca mais barata que ataca a causa certa.
; Se a placa ficar instavel ou nao bootar, volte para 40000000L.
board_build.f_flash     = 80000000L
board_build.partitions  = huge_app.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

lib_deps =
    fdivitto/FabGL @ ^1.0.9

; src/reSID/sid.cpp e' um unity build: da #include em todos os .cc de
; src/reSID/reSID/. Sem excluir a pasta, a PlatformIO compila os .cc de novo
; e o link quebra com simbolo duplicado.
build_src_filter = +<*> -<reSID/reSID/>

; PSRAM DESLIGADA de proposito -- nao apague estas linhas comentadas.
;
; A placa TEM PSRAM (4 MB, detectada). Mas ela nao serve para nada aqui: o
; framebuffer precisa de DRAM interna, porque o DMA do I2S nao le PSRAM.
; Em compensacao, habilita-la obriga o -mfix-esp32-psram-cache-issue, que
; insere trabalho extra em TODO o codigo gerado e aumenta a pressao no cache
; de instrucoes. Medido neste projeto: ~30% de queda no emulador.
;
;   -DBOARD_HAS_PSRAM
;   -mfix-esp32-psram-cache-issue
;
; -Os em vez de -O2: parece errado, mas o gargalo aqui e' busca de instrucao
; na flash, nao trabalho de CPU. Binario menor = menos erro de cache. O -O2
; desenrola lacos e inlina agressivamente, o que incha o codigo quente e piora
; exatamente o que estamos tentando consertar. Se medir pior, volte para -O2.
build_flags =
    -Isrc/reSID
    -Os
    -Wno-error
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-unused-function
    -Wno-char-subscripts
    -Wno-format
    -Wno-write-strings
    -Wno-deprecated-declarations
    -Wno-narrowing